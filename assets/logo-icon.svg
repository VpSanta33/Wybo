<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D3A8C"/>
      <stop offset="1" stop-color="#6C63C9"/>
    </linearGradient>
  </defs>

  <!-- 夜空背景 -->
  <rect width="128" height="128" rx="30" fill="url(#sky)"/>

  <!-- 星星（圆点） -->
  <g fill="#FFFFFF">
    <circle cx="30" cy="20" r="2.4"/>
    <circle cx="100" cy="16" r="1.9"/>
    <circle cx="112" cy="46" r="2.1"/>
    <circle cx="24" cy="104" r="2.0"/>
    <circle cx="100" cy="108" r="2.3"/>
  </g>
  <g fill="#A8D8EA">
    <circle cx="46" cy="14" r="1.6"/>
    <circle cx="92" cy="36" r="1.5"/>
    <circle cx="14" cy="66" r="1.8"/>
    <circle cx="82" cy="16" r="1.4"/>
  </g>
  <!-- 四角星光 -->
  <path d="M16 21 l1.5 3 3 1.5 -3 1.5 -1.5 3 -1.5 -3 -3 -1.5 3 -1.5 Z" fill="#FFFFFF"/>
  <path d="M108 73 l1.5 3 3 1.5 -3 1.5 -1.5 3 -1.5 -3 -3 -1.5 3 -1.5 Z" fill="#A8D8EA"/>

  <!-- 满月 + 高光 -->
  <circle cx="64" cy="62" r="42" fill="#FFD166"/>
  <circle cx="47" cy="44" r="26" fill="#FFE08A" opacity="0.45"/>

  <!-- 兔子耳朵（望月小兔） -->
  <ellipse cx="50" cy="30" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(-12 50 30)"/>
  <ellipse cx="78" cy="30" rx="8.5" ry="20" fill="#FFFFFF" transform="rotate(12 78 30)"/>
  <ellipse cx="50" cy="32" rx="4.2" ry="12.5" fill="#FF9EC4" transform="rotate(-12 50 32)"/>
  <ellipse cx="78" cy="32" rx="4.2" ry="12.5" fill="#FF9EC4" transform="rotate(12 78 32)"/>

  <!-- 兔子头 -->
  <circle cx="64" cy="76" r="27" fill="#FFFFFF"/>

  <!-- 脸 -->
  <circle cx="55" cy="72" r="3" fill="#3D3A8C"/>
  <circle cx="73" cy="72" r="3" fill="#3D3A8C"/>
  <circle cx="56" cy="71" r="1" fill="#FFFFFF"/>
  <circle cx="74" cy="71" r="1" fill="#FFFFFF"/>
  <ellipse cx="64" cy="80" rx="2.5" ry="1.9" fill="#FF9EC4"/>
  <path d="M60 84 Q64 88 68 84" stroke="#3D3A8C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <ellipse cx="46" cy="82" rx="5.5" ry="3.4" fill="#FF9EC4" opacity="0.55"/>
  <ellipse cx="82" cy="82" rx="5.5" ry="3.4" fill="#FF9EC4" opacity="0.55"/>
</svg>
