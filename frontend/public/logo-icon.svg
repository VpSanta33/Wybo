<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="qy-sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3E44"/>
      <stop offset="0.55" stop-color="#0F4C52"/>
      <stop offset="1" stop-color="#196F77"/>
    </linearGradient>
    <linearGradient id="qy-peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F5F3"/>
    </linearGradient>
  </defs>

  <!-- 深青底框 -->
  <rect width="128" height="128" rx="30" fill="url(#qy-sea)"/>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

  <!-- 屿上微光 -->
  <circle cx="91" cy="35" r="11" fill="#8CDAD1" opacity="0.22"/>
  <circle cx="91" cy="35" r="4.5" fill="#E8FAF8" opacity="0.92"/>

  <!-- 岛屿剪影 -->
  <path d="M22 76 C35 76 41 40 57 40 C72 40 78 76 92 76 Z" fill="url(#qy-peak)"/>
  <path d="M62 76 C70 76 76 52 88 52 C98 52 102 76 108 76 Z" fill="#8CDAD1" opacity="0.9"/>

  <!-- 双重浪线 -->
  <path d="M20 85 Q35 78 50 85 T80 85 T108 85" stroke="#F7FCFB" stroke-width="6.5" stroke-linecap="round" fill="none"/>
  <path d="M29 100 Q44 93 59 100 T89 100 T101 100" stroke="#8CDAD1" stroke-width="5.5" stroke-linecap="round" fill="none"/>
</svg>
